server:
  port: 8080

spring:
  application:
    name: booth
  datasource:
    url: jdbc:mysql://192.168.148.3:3306/booth?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

jwt:
  secret: booth-local-market-secret-key-2026-must-be-at-least-32-bytes
  expiration: 86400000   # 24 小时

# 文件上传目录（证明材料存服务端）
booth:
  upload-dir: ${user.dir}/uploads
